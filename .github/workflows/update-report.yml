name: Update Stores Daily Report

on:
  schedule:
    # 09:00 Kyiv is 06:00 UTC in summer and 07:00 UTC in winter.
    # Both events are scheduled; the guard below admits only the matching one.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stores-daily-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check this schedule matches 09:00 Kyiv
        id: kyiv-time
        run: |
          set -euo pipefail
          offset="$(TZ=Europe/Kyiv date +%z)"
          case "$offset" in
            +0300) expected='0 6 * * *' ;;
            +0200) expected='0 7 * * *' ;;
            *) echo "Unexpected Kyiv offset: $offset"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$SCHEDULE" = "$expected" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping '$SCHEDULE'; Kyiv offset $offset expects '$expected'."
          fi
        env:
          SCHEDULE: ${{ github.event.schedule }}
      - name: Install dependencies
        if: steps.kyiv-time.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Fetch daily ENT and SMB partner data
        if: steps.kyiv-time.outputs.run == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: python fetch_daily_partner_data.py
      - name: Validate daily extract
        if: steps.kyiv-time.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("daily_partner_data.json"))
          if not payload.get("rows"):
              raise SystemExit("Daily extract is empty")
          print(f"OK: {len(payload['rows'])} rows through {payload['through']}")
          PY
      - name: Commit refreshed data
        if: steps.kyiv-time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_partner_data.json
          git diff --cached --quiet || git commit -m "Refresh daily Stores report"
          git push
